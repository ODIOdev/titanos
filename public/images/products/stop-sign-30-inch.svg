<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 400 400" role="img" aria-label="Stop Sign 30-Inch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#090D11"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2430" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)" opacity="0.6"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#F5C400" stroke-width="2" opacity="0.35"/>
  <rect x="40" y="40" width="320" height="320" fill="none" stroke="#F5C400" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="140" r="48" fill="none" stroke="#F5C400" stroke-width="3" opacity="0.85"/>
  <path d="M170 140 L190 160 L235 115" fill="none" stroke="#F5C400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <text x="200" y="210" text-anchor="middle" fill="#F5C400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">STOP SIGN 30-INCH</text>
  <text x="200" y="280" text-anchor="middle" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5">TITAN SAFETY CO.</text>
  <text x="200" y="340" text-anchor="middle" fill="#3a4654" font-family="Arial, Helvetica, sans-serif" font-size="9">stop-sign-30-inch</text>
</svg>
